# CI mínima: corre la suite de tests en cada push y cada pull request.
#
# POR QUÉ EXISTE: este repositorio tenía 29 métodos @Test y ningún workflow.
# Entre ellos están PanelEscribeEnElNegocioCorrectoTest y TenantAwareDataSourceTest,
# que son la red que protege el aislamiento entre negocios — precisamente los que
# no pueden romperse en silencio.
#
# JDK 17 no es un supuesto: sale de build.gradle:13
#   java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
#
# DOCKER: la suite usa Testcontainers (build.gradle:59-60) para levantar un
# Postgres real; los runners `ubuntu-latest` de GitHub lo traen de fábrica.

name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ./gradlew test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Correr los tests
        run: ./gradlew test --no-daemon

      - name: Publicar el informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14

      - name: Resumen de resultados
        if: always()
        run: |
          if [ ! -d build/test-results/test ]; then
            echo "No se generaron resultados de tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          fallos=$(grep -ho 'failures="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          errores=$(grep -ho 'errors="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          omitidos=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml \
                  | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          {
            echo "## Resultado de los tests"
            echo ""
            echo "| | |"
            echo "|---|---:|"
            echo "| Ejecutados | $total |"
            echo "| Fallidos | $fallos |"
            echo "| Con error | $errores |"
            echo "| Omitidos | $omitidos |"
          } >> "$GITHUB_STEP_SUMMARY"
